server:
  port: 8084

spring:
  application:
    name: payment-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/airsync_payments
    username: postgres
    password: 1212
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

paystack:
  secret-key: your_paystack_secret_key_here
  base-url: https://api.paystack.co

rabbitmq:
  exchange: airsync.exchange
  routing-key: payment.events
  queue: payment.notification.queue
